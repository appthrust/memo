name: Publish Authz Probe (ink test)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Authz Probe version (SemVer without a v prefix)
        required: true
        type: string
        default: '0.1.0'

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: authz-test-catalog-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'appthrust/memo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.1
      - name: Check catalog contract
        run: bun test hack/authz-test-catalog.test.ts
      - name: Select version
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          test "${#VERSION}" -le 63
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push both architectures
        id: image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --file Dockerfile.authz-probe --build-arg "VERSION=$VERSION" \
            --tag "ghcr.io/appthrust/memo:authz-probe-$VERSION" \
            --label "org.opencontainers.image.source=https://github.com/appthrust/memo" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --metadata-file "$RUNNER_TEMP/authz-probe-image.json" .
          digest="$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/authz-probe-image.json")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Publish and sign the ink-only catalog
        id: catalog
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test "$GITHUB_WORKFLOW_REF" = 'appthrust/memo/.github/workflows/authz-probe.yml@refs/heads/main'
          bun hack/authz-test-catalog.ts --version "$VERSION" --digest "$DIGEST"
      - name: Verify the signed catalog
        env:
          CATALOG_DIGEST: ${{ steps.catalog.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity 'https://github.com/appthrust/memo/.github/workflows/authz-probe.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "ghcr.io/appthrust/memo@$CATALOG_DIGEST"
          {
            echo '### Ink-only authz-test catalog'
            echo
            echo "Catalog digest: \`$CATALOG_DIGEST\`"
            echo "Reference: \`ghcr.io/appthrust/memo@$CATALOG_DIGEST\`"
            echo 'Tag: `authz-test-catalog`'
          } >> "$GITHUB_STEP_SUMMARY"
